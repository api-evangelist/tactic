name: Tactic
description: 'Tactic was a cryptocurrency and digital-asset accounting platform founded in 2021 in
  New York and backed by Lux Capital. Its product aggregated on-chain activity and exchange/custody
  data (Coinbase and others) into a unified treasury view and crypto sub-ledger, automatically
  categorizing transactions, calculating USD gain/loss and taxable events, and reconciling the
  crypto sub-ledger to traditional accounting software such as QuickBooks. Tactic launched from
  stealth in 2022 (originally on choosetactic.com, later the exact-match tactic.com) and raised
  roughly $13.6M before being acquired by TaxBit in January 2023 to augment TaxBit''s digital-asset
  accounting suite. The standalone product, developer portal, and API surface have been retired;
  the tactic.com domain is now listed for sale and no independent developer surface remains.'
